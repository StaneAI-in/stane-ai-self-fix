<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Stane AI SELF-FIX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Stane AI SELF-FIX</h1>
    <p class="summary" id="summary"></p>
  </header>

  <p class="notice" id="notice" hidden></p>

  <main class="layout">
    <section class="calendar" aria-label="Calendar">
      <div class="cal-head">
        <button type="button" class="nav" id="prev" aria-label="Previous month">&#8249;</button>
        <h2 id="monthTitle"></h2>
        <button type="button" class="nav" id="next" aria-label="Next month">&#8250;</button>
        <button type="button" class="today-btn" id="goToday">Today</button>
      </div>
      <div class="weekdays" aria-hidden="true">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="day" aria-label="Tasks for the selected day">
      <div class="day-head">
        <h2 id="dayTitle"></h2>
        <button type="button" class="cross-btn" id="crossBtn"></button>
      </div>
      <p class="hint" id="crossHint"></p>

      <form class="add" id="addForm" autocomplete="off">
        <input type="text" id="taskInput" maxlength="200" placeholder="Add a task for this day" aria-label="New task">
        <button type="submit">Add</button>
      </form>

      <ul class="tasks" id="taskList"></ul>
      <p class="empty" id="empty">No tasks for this day yet.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
